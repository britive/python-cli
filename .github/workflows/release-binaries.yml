# Builds standalone, self-contained pybritive installers (no Python required on
# the target machine) and attaches them to the GitHub Release. Mirrors the AWS
# CLI v2 distribution model: PyInstaller onedir bundle wrapped in a native
# installer per OS. Builds run natively per-OS because PyInstaller cannot
# cross-compile. The existing PyPI publish workflow is left untouched.
name: Build Standalone Installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version string to stamp onto artifacts (defaults to the tag/_init_ version)
        required: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-15-intel # Intel (macos-13, the old Intel label, was retired Dec 2025)
            label: macos-x86_64
          - os: macos-latest   # Apple Silicon
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
            winarch: x64
          - os: windows-11-arm
            label: windows-arm64
            winarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . -r packaging/requirements-build.txt

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(python -c 'from importlib.metadata import version; print(version("pybritive"))')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Build PyInstaller bundle
        run: pyinstaller packaging/pybritive.spec --noconfirm

      - name: Smoke test bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          ./dist/pybritive/pybritive --version
          ./dist/pybritive/pybritive-kube-exec --version
          ./dist/pybritive/pybritive-aws-cred-process --version

      - name: Smoke test bundle (Windows)
        if: runner.os == 'Windows'
        run: |
          .\dist\pybritive\pybritive.exe --version
          .\dist\pybritive\pybritive-kube-exec.exe --version
          .\dist\pybritive\pybritive-aws-cred-process.exe --version

      # ---- Linux: zip + install script -------------------------------------
      - name: Package Linux (zip + installer)
        if: runner.os == 'Linux'
        run: |
          STAGE="pybritive-${{ steps.ver.outputs.version }}-${{ matrix.label }}"
          mkdir -p "$STAGE"
          cp -R dist/pybritive "$STAGE/pybritive"
          cp packaging/linux/install "$STAGE/install"
          chmod +x "$STAGE/install"
          zip -r -q -y "dist/${STAGE}.zip" "$STAGE"
          echo "ARTIFACT=dist/${STAGE}.zip" >> "$GITHUB_ENV"

      # ---- macOS: signed/notarized .pkg ------------------------------------
      # Signing needs the Developer ID certs in a keychain and a notarytool
      # credential profile on the runner; import both from secrets when they
      # are configured, otherwise build unsigned.
      - name: Set up signing keychain (macOS)
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "MACOS_CERT_P12_BASE64 not set; building unsigned"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials pybritive-notary \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "AC_NOTARY_PROFILE=pybritive-notary" >> "$GITHUB_ENV"
          fi

      - name: Package macOS (.pkg)
        if: runner.os == 'macOS'
        env:
          # Wire these to repo secrets to enable signing + notarization
          # (AC_NOTARY_PROFILE is exported by the keychain setup step).
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          bash packaging/macos/build-pkg.sh "${{ steps.ver.outputs.version }}"
          echo "ARTIFACT=$(ls dist/*.pkg)" >> "$GITHUB_ENV"

      # ---- Windows: signed MSI ---------------------------------------------
      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix

      - name: Package Windows (.msi)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_PFX_BASE64: ${{ secrets.WIN_PFX_BASE64 }}
          WIN_PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}
        run: |
          $args = @{ Version = "${{ steps.ver.outputs.version }}"; Arch = "${{ matrix.winarch }}" }
          if ($env:WIN_PFX_BASE64) {
            [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WIN_PFX_BASE64))
            $args.PfxPath = "cert.pfx"
            $args.PfxPassword = $env:WIN_PFX_PASSWORD
          }
          .\packaging\windows\build-msi.ps1 @args
          "ARTIFACT=$(Get-ChildItem dist\*.msi | Select-Object -First 1 -ExpandProperty FullName)" `
            | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pybritive-${{ matrix.label }}
          path: ${{ env.ARTIFACT }}

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}
